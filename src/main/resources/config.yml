# ═══════════════════════════════════════════════════════════════════════════════
#  AppleCore — основная конфигурация
#  /applecore reload применяет изменения (включение команд и модулей — после рестарта).
#  Тексты сообщений — в messages.yml, настройки команд — в commands.yml.
# ═══════════════════════════════════════════════════════════════════════════════

# Модули: false — модуль не регистрирует ни команд, ни обработчиков (нужен рестарт).
modules:
  teleport: true
  homes: true
  spawn: true
  player: true
  world: true
  economy: true
  warps: true

permissions:
  # Второй набор прав: точные права EssentialsX (essentials.fly, essentials.home.others,
  # essentials.sethome.multiple.vip …) работают наравне с правами applecore.*.
  # Если в LuckPerms уже настроены права EssentialsX, менять ничего не нужно. Таблица: docs/PERMISSIONS.md
  essentials-compat: true

commands:
  # Скрывать команды без прав из подсказок (и отвечать «неизвестная команда»).
  # На донат-сервере лучше false: игрок увидит, какая привилегия открывает команду.
  hide-unpermitted: false
  # При нехватке прав называть самую дешёвую привилегию, которая их даёт (ranks.yml, этап 5).
  no-permission-rank-hint: true

# ─── Ресурспак APPLECUBE «bordo» (через ItemsAdder) ─────────────────────────────
resource-pack:
  # true  — меню с фонами из пака, кнопки через item_model, звуки пака, значки в чате, жирный шрифт меню.
  # false — обычный ванильный вид везде (пак не нужен).
  enabled: true
  # Игроки, отказавшиеся от пака (или у которых он не загрузился), автоматически видят ванильный вид.
  plain-for-declined: true
  # Рамка подсказок для всех предметов меню при включённом паке ("" — без рамки).
  tooltip-style: "bordo_menu:menu"
  # Шрифт для тега <menu-font>.
  menu-font: "bordo_menu:bold"
  # Отправка пака самим AppleCore. Оставьте выключенным, если пак раздаёт ItemsAdder.
  send:
    enabled: false
    url: ""
    hash: ""
    required: false

# Цвета темы — теги <accent>, <text>, <muted> … в messages.yml.
style:
  colors:
    accent: "#FB2200"
    text: "#F8F0DC"
    muted: "#9C8C80"
    highlight: "#FFC94A"
    good: "#5BD16B"
    bad: "#FF5A4E"
    warn: "#FFC23D"
    info: "#59C3FF"

# Звуки: pack — если у игрока ресурспак, plain — без него.
sounds:
  menu-open:
    pack: "bordo_menu:menu.open_rtp"
    plain: "minecraft:block.ender_chest.open"
    volume: 0.8
  click:
    pack: "bordo_menu:auction.tick"
    plain: "minecraft:ui.button.click"
    volume: 0.6
  success:
    pack: "bordo_menu:auction.success"
    plain: "minecraft:entity.player.levelup"
    volume: 0.8
  error:
    pack: "bordo_menu:auction.cancel"
    plain: "minecraft:block.note_block.bass"
    volume: 0.8
  teleport:
    pack: "minecraft:entity.enderman.teleport"
    plain: "minecraft:entity.enderman.teleport"
    volume: 0.7

# ─── Телепортация (дома, варпы, спавн, tpa …) ──────────────────────────────────
teleport:
  # Задержка в секундах. applecore.teleport.delay.<n> уменьшает её для привилегий,
  # applecore.teleport.bypass-delay (essentials.teleport.timer.bypass) убирает совсем.
  delay: 3
  cancel-on-move: true
  cancel-on-damage: true
  particles: true
  bossbar:
    enabled: true
    # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE. YELLOW скрывает модуль пака bossbar_clear.
    color: RED
    overlay: PROGRESS
  # Искать безопасное место, если точка занята блоками или под ней лава/пустота.
  safe-location: true
  # Неуязвимость после телепортации (в тиках, 20 = 1 секунда).
  invulnerability-ticks: 60
  # Дальность /jump в блоках.
  jump-distance: 160
  requests:
    # Сколько живёт запрос /tpa: 60s, 2m …
    timeout: 2m
  back:
    # Запоминать прошлое место при телепортации командами и плагинами (для /back).
    record-teleports: true
    # Запоминать место смерти (нужно applecore.back.ondeath / essentials.back.ondeath).
    record-death: true

# ─── Дома ──────────────────────────────────────────────────────────────────────
homes:
  # Лимит без прав на лимит. Больше — applecore.homes.limit.<n> или applecore.homes.unlimited.
  default-limit: 1
  # Название для /sethome без аргумента.
  default-name: home
  # Наборы как sethome-multiple в EssentialsX: essentials.sethome.multiple даёт «default»,
  # essentials.sethome.multiple.<набор> — значение набора. Выбирается наибольший лимит.
  sethome-multiple:
    default: 3
    vip: 5
    staff: 10
  # Миры, где нельзя ставить дом (обход: applecore.sethome.bypass-world).
  disabled-worlds: []

# ─── Спавн ─────────────────────────────────────────────────────────────────────
spawn:
  teleport-on-first-join: true
  teleport-on-join: false
  # Возрождать на спавне, если у игрока нет кровати/якоря возрождения.
  respawn-at-spawn: true
  # Возрождать на спавне всегда, даже с кроватью.
  force-respawn-at-spawn: false
  # /setspawn также ставит точку возрождения мира.
  set-world-spawn: true
  # Падение в пустоту в указанных мирах возвращает на спавн.
  void:
    enabled: false
    worlds: [spawn]
    y: -64

# ─── Возможности игрока ────────────────────────────────────────────────────────
fly:
  # Миры, где /fly не включается (обход: applecore.fly.bypass-world).
  disabled-worlds: []
speed:
  # Максимальная скорость без applecore.speed.bypass (1–10).
  max-fly: 10
  max-walk: 10
near:
  # Радиус /near по умолчанию и максимум без applecore.near.maxexempt.
  radius: 200
nick:
  prefix: "~"
  min-length: 3
  max-length: 16
  # Допустимые символы ника (регулярное выражение, без учёта цветов).
  allowed: "[\\p{L}\\p{N}_]+"
  # Показывать ник и в табе.
  tab-list: true
vanish:
  # Игроки в ванише не подбирают предметы.
  prevent-pickup: true
repair:
  # Чинить зачарованные предметы без applecore.repair.enchanted (как repair-enchanted в EssentialsX).
  allow-enchanted: true
  # Стоимость починки (0 — бесплатно; обход: applecore.repair.free).
  cost:
    hand: 0
    all: 0
itemname:
  max-length: 50
fireball:
  # Разрушают ли /fireball и /beezooka блоки.
  block-damage: false

# ─── /day, /night, /sun, /rain, /storm ─────────────────────────────────────────
world-commands:
  # Миры, где можно менять время и погоду (пусто — во всех; обход: applecore.world-commands.any-world).
  worlds: []
  # Сообщать игрокам мира, кто изменил время или погоду.
  broadcast: true

# ─── Экономика ─────────────────────────────────────────────────────────────────
economy:
  # auto      — AppleCore регистрирует свою экономику в Vault с низшим приоритетом:
  #             если есть другой плагин экономики (CMI, XConomy …), работает он.
  # applecore — экономика AppleCore главная.
  # none      — своей экономики нет, только чужая через Vault.
  provider: auto
  starting-balance: 0
  # Формат сумм (java.text.DecimalFormat) и подпись валюты.
  format: "#,##0.##"
  grouping-separator: " "
  currency-suffix: " ⛃"
  currency-singular: "монета"
  currency-plural: "монет"
  pay:
    min: 1
    # Комиссия перевода в процентах.
    commission-percent: 0
  # Как часто пересчитывать /baltop для чужого плагина экономики.
  baltop-refresh: 5m
  # Сообщать игроку об /eco give|take|set.
  notify-eco: true

# ─── Варпы (/warp, /setwarp, /serverwarp) ────────────────────────────────────
# Внешний вид меню — menus/warps.yml, тексты — messages.yml (warps.*, menus.warps.*).
warps:
  # Какая вкладка открывается по /warp: server или players (/playerwarps всегда открывает варпы игроков).
  default-tab: server
  # Сколько варпов может создать игрок без привилегии. Больше — applecore.playerwarps.limit.<n>
  # (берётся наибольшее), без ограничений — applecore.playerwarps.unlimited. 0 — только по правам.
  player-limit: 1
  # Цена создания варпа игрока (нужен Vault). 0 — бесплатно. Без оплаты: applecore.setwarp.free
  creation-cost: 0
  # Миры, где игроки не могут ставить варпы. Обход: applecore.setwarp.bypass-world
  disabled-worlds: []
  # Допустимые названия варпов (регулярное выражение Java).
  name-pattern: "[\\p{L}\\p{N}_\\-]{2,16}"
  # Порядок варпов игроков: likes (лайки, потом посещения), visits, newest или name.
  sort: likes
  # true — на каждый серверный варп нужно право applecore.warps.<варп> (в EssentialsX: essentials.warps.<варп>),
  # как per-warp-permission в EssentialsX.
  per-warp-permission: false
  # Команда кнопки «Назад» без «/», например главное меню DeluxeMenus. Пусто — кнопка просто закрывает меню.
  back-command: "menu"
  # Описание варпа игрока (/warpdesc): строк и символов в строке.
  description:
    max-lines: 3
    max-line-length: 40

storage:
  # Как часто изменённые данные игроков сохраняются на диск (минуты).
  autosave-minutes: 5
