# ═══════════════════════════════════════════════════════════════════════════════
#  AppleCore — English
#
#  Format: MiniMessage (https://docs.advntr.dev/minimessage/format); legacy &-codes also work.
#  AppleCore tags:
#    <prefix:ok|error|warn|info>        message icon (with the pack: APPLECUBE "!" icons)
#    <icon:lmb|rmb|mmb|bar|dot|apple>   mouse buttons, bar, dot, apple
#    <menu-font>…</menu-font>           the pack's bold menu font (plain bold without the pack)
#    <accent> <text> <muted> <highlight> <good> <bad> <warn> <info>
#                                       theme colours (config.yml → style.colors)
#    <pack>…</pack> / <plain>…</plain>  only with / only without the resource pack
#  Write pack glyphs in double quotes: "\uEBA1". An empty string '' disables a message.
# ═══════════════════════════════════════════════════════════════════════════════

prefix:
  ok: "<pack><white>\uEBA1</white> </pack><plain><good>✔</good> </plain>"
  error: "<pack><white>\uEBA0</white> </pack><plain><bad>✘</bad> </plain>"
  warn: "<pack><white>\uEBA2</white> </pack><plain><warn>⚠</warn> </plain>"
  info: "<pack><white>\uEBA3</white> </pack><plain><info>✦</info> </plain>"

icons:
  lmb: "<pack><white>\uEB01</white></pack><plain><highlight>LMB</highlight></plain>"
  rmb: "<pack><white>\uEB02</white></pack><plain><highlight>RMB</highlight></plain>"
  mmb: "<pack><white>\uEB03</white></pack><plain><highlight>MMB</highlight></plain>"
  bar: "<pack>\uEB00</pack><plain>┃</plain>"
  dot: "<pack>\uEB05</pack><plain>•</plain>"
  apple: "<pack><white>\uEB04</white></pack><plain><accent>❤</accent></plain>"

common:
  enabled: "<good>enabled</good>"
  disabled: "<bad>disabled</bad>"
  none: "<muted>none</muted>"
  console: "Console"

time:
  days: "<amount>d"
  hours: "<amount>h"
  minutes: "<amount>m"
  seconds: "<amount>s"

errors:
  no-permission: "<prefix:error><text>You don't have permission to use this command."
  no-permission-rank: "<prefix:error><text>Available from the <rank><text> rank. Get it at <click:open_url:'https://applecube.fun'><hover:show_text:'<text>Open the store'><accent><u>applecube.fun</u></accent></hover></click>"
  players-only: "<prefix:error><text>Only players can use this command."
  player-not-found: "<prefix:error><text>Player <accent><player></accent> is not online."
  player-never-joined: "<prefix:error><text>Player <accent><player></accent> has never joined this server."
  invalid-number: "<prefix:error><text>\"<accent><input></accent>\" is not a number."
  number-range: "<prefix:error><text>Enter a number from <accent><min></accent> to <accent><max></accent>."
  cooldown: "<prefix:warn><text>Please wait <accent><time></accent>."
  internal: "<prefix:error><text>Something went wrong. Please tell the staff."
  economy-unavailable: "<prefix:error><text>Economy is unavailable: Vault and an economy plugin are required."

teleport:
  warmup: "<prefix:info><text>Teleporting in <accent><seconds>s</accent> — don't move."
  bossbar: "<text>Teleporting in <highlight><seconds></highlight>s"
  cancelled-move: "<prefix:warn><text>Teleport cancelled: you moved."
  cancelled-damage: "<prefix:warn><text>Teleport cancelled: you took damage."
  unsafe: "<prefix:error><text>The destination is unsafe — teleport cancelled."
  failed: "<prefix:error><text>Teleport failed."

resource-pack:
  prompt: "<accent>APPLECUBE</accent> <text>— server resource pack: menus, icons and font."

commands:
  applecore:
    description: "Manage the AppleCore plugin"
    usage: "<prefix:info><text>Usage: <accent>/applecore <reload|info></accent>"
    reloaded: "<prefix:ok><text>AppleCore reloaded in <accent><ms> ms</accent>. New commands and modules apply after a restart."
    info:
      - "<accent><menu-font>AppleCore</menu-font></accent> <muted>v<version>"
      - " <icon:dot> <text>Language: <highlight><language>"
      - " <icon:dot> <text>Resource pack: <resourcepack>"
      - " <icon:dot> <text>Modules: <highlight><modules>"
      - " <icon:dot> <text>Commands: <highlight><commands>"
      - " <icon:dot> <text>Integrations: <muted><hooks>"
