# ═══════════════════════════════════════════════════════════════════════════════
#  AppleCore — настройки команд
#  Команды, которых здесь нет, работают по умолчанию: включены, встроенные алиасы, без задержки.
#
#    enabled: false   — не регистрировать команду (например, оставить её другому плагину) — рестарт
#    aliases: [a, b]  — заменить встроенные алиасы — рестарт
#    cooldown: 30s    — задержка между использованиями: 10s, 5m, 1h30m, 1ч30м … — /applecore reload
#                       обход: applecore.<команда>.cooldown.bypass или applecore.cooldown.bypass
#                       (в EssentialsX: essentials.commandcooldowns.bypass[.<команда>])
#
#  /ec и киты в AppleCore намеренно отсутствуют — это AppleEnderChest и AppleKits.
# ═══════════════════════════════════════════════════════════════════════════════

applecore:
  aliases: [acore]

# ─── Телепортация ──────────────────────────────────────────────────────────────
tp:
  aliases: [tele, tp2p]
tphere:
  aliases: [s]
tppos:
  aliases: [tpcord, pos]
back:
  aliases: [return]
  cooldown: 0
jump:
  aliases: [j, jumpto]
tpa:
  aliases: [call, tpask]
  cooldown: 0
tpaccept:
  aliases: [tpyes, tpallow]
tpdeny:
  aliases: [tpno, tpcancel]

# ─── Дома и спавн ──────────────────────────────────────────────────────────────
sethome:
  aliases: [createhome]
delhome:
  aliases: [remhome, rmhome, removehome, deletehome]
playerhome:
  aliases: [phome]
spawn:
  cooldown: 0

# ─── Возможности игрока ────────────────────────────────────────────────────────
heal:
  cooldown: 60s
feed:
  aliases: [eat, food]
  cooldown: 30s
ext:
  aliases: [extinguish]
god:
  aliases: [godmode, tgm]
gamemode:
  aliases: [gm]
workbench:
  aliases: [craft, wb, wbench]
cartographytable:
  aliases: [carttable, cartography]
smithingtable:
  aliases: [smithtable]
enchantingtable:
  aliases: [etable, enchanttable]
disposal:
  aliases: [trash]
repair:
  aliases: [fix]
itemdb:
  aliases: [dura, durability, itemno, db]
itemname:
  aliases: [iname, itemrename, irename, rename]
clearinventory:
  aliases: [ci, clean, clear, clearinvent]
getpos:
  aliases: [coords, position, whereami, getlocation, getloc, getcord, curpos]
list:
  aliases: [online, playerlist, plist, who, players]
fireball:
  aliases: [fireentity, fireskull]
  cooldown: 3s
beezooka:
  aliases: [beecannon]
  cooldown: 3s
vanish:
  aliases: [v]

# ─── Время и погода (донат) ────────────────────────────────────────────────────
day:
  cooldown: 60s
night:
  cooldown: 60s
sun:
  cooldown: 60s
rain:
  cooldown: 60s
storm:
  cooldown: 60s

# ─── Экономика (отключите, если /balance, /pay, /eco даёт другой плагин) ───────
balance:
  aliases: [bal, money]
balancetop:
  aliases: [baltop, topbal]
paytoggle:
  aliases: [payoff, payon]
eco:
  aliases: [economy]
