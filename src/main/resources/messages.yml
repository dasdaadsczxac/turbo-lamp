# ═══════════════════════════════════════════════════════════════════════════════
#  AppleCore — сообщения
#
#  Формат: MiniMessage (https://docs.advntr.dev/minimessage/format), &-коды тоже работают.
#  Теги AppleCore:
#    <prefix:ok|error|warn|info>        значок перед сообщением (с паком — «!»-иконки APPLECUBE)
#    <icon:lmb|rmb|mmb|bar|dot|apple>   иконки мыши, полоска, точка, яблоко
#    <menu-font>…</menu-font>           жирный шрифт меню пака (без пака — обычный жирный)
#    <accent> <text> <muted> <highlight> <good> <bad> <warn> <info>
#                                       цвета темы (config.yml → style.colors)
#    <pack>…</pack> / <plain>…</plain>  только с ресурспаком / только без него
#  Символы пака пишите в двойных кавычках: "\uEBA1". Пустая строка '' отключает сообщение.
#  Плейсхолдеры вида <player> подставляет плагин; %плейсхолдеры% PlaceholderAPI тоже работают.
# ═══════════════════════════════════════════════════════════════════════════════

prefix:
  ok: "<pack><white>\uEBA1</white> </pack><plain><good>✔</good> </plain>"
  error: "<pack><white>\uEBA0</white> </pack><plain><bad>✘</bad> </plain>"
  warn: "<pack><white>\uEBA2</white> </pack><plain><warn>⚠</warn> </plain>"
  info: "<pack><white>\uEBA3</white> </pack><plain><info>✦</info> </plain>"

icons:
  lmb: "<pack><white>\uEB01</white></pack><plain><highlight>ЛКМ</highlight></plain>"
  rmb: "<pack><white>\uEB02</white></pack><plain><highlight>ПКМ</highlight></plain>"
  mmb: "<pack><white>\uEB03</white></pack><plain><highlight>СКМ</highlight></plain>"
  bar: "<pack>\uEB00</pack><plain>┃</plain>"
  dot: "<pack>\uEB05</pack><plain>•</plain>"
  apple: "<pack><white>\uEB04</white></pack><plain><accent>❤</accent></plain>"

common:
  enabled: "<good>включено</good>"
  disabled: "<bad>выключено</bad>"
  none: "<muted>нет</muted>"
  console: "Консоль"
  unlimited: "∞"

time:
  days: "<amount> д"
  hours: "<amount> ч"
  minutes: "<amount> мин"
  seconds: "<amount> сек"

errors:
  no-permission: "<prefix:error><text>Недостаточно прав для этой команды."
  no-permission-rank: "<prefix:error><text>Доступно с привилегии <rank><text>. Купить: <click:open_url:'https://applecube.fun'><hover:show_text:'<text>Открыть сайт'><accent><u>applecube.fun</u></accent></hover></click>"
  players-only: "<prefix:error><text>Команда доступна только игрокам."
  player-not-found: "<prefix:error><text>Игрок <accent><player></accent> не в сети."
  player-never-joined: "<prefix:error><text>Игрок <accent><player></accent> ни разу не заходил на сервер."
  invalid-number: "<prefix:error><text>«<accent><input></accent>» — не число."
  number-range: "<prefix:error><text>Укажите число от <accent><min></accent> до <accent><max></accent>."
  cooldown: "<prefix:warn><text>Подождите ещё <accent><time></accent>"
  internal: "<prefix:error><text>Что-то пошло не так. Сообщите администрации."
  economy-unavailable: "<prefix:error><text>Экономика недоступна: нужен Vault и плагин экономики."
  world-not-found: "<prefix:error><text>Мир <accent><world></accent> не найден."
  empty-hand: "<prefix:error><text>Возьмите предмет в руку."
  not-enough-money: "<prefix:error><text>Недостаточно денег: нужно <accent><amount></accent>."

teleport:
  warmup: "<prefix:info><text>Телепортация через <accent><seconds> сек.</accent> — не двигайтесь."
  bossbar: "<text>Телепортация через <highlight><seconds></highlight> сек."
  cancelled-move: "<prefix:warn><text>Телепортация отменена: вы сдвинулись с места."
  cancelled-damage: "<prefix:warn><text>Телепортация отменена: вы получили урон."
  unsafe: "<prefix:error><text>Точка назначения небезопасна — телепортация отменена."
  failed: "<prefix:error><text>Не удалось телепортироваться."

resource-pack:
  prompt: "<accent>APPLECUBE</accent> <text>— ресурспак сервера: меню, иконки и шрифт."

# Запросы на телепортацию (/tpa, /tpahere)
tpa:
  self: "<prefix:error><text>Нельзя отправить запрос самому себе."
  disabled: "<prefix:error><text>Игрок <accent><player></accent> отключил телепортацию к себе."
  cannot-accept: "<prefix:error><text>Игрок <accent><player></accent> не может принимать запросы."
  sent: "<prefix:ok><text>Запрос отправлен игроку <accent><player></accent>. Он действует <highlight><time></highlight>"
  received: "<prefix:info><accent><player></accent> <text>хочет телепортироваться к вам."
  received-here: "<prefix:info><accent><player></accent> <text>просит вас телепортироваться к нему."
  buttons: " <accept>  <deny>  <muted>или /tpaccept, /tpdeny"
  button-accept: "<good>[✔ Принять]</good>"
  button-accept-hover: "<text>Нажмите, чтобы принять запрос"
  button-deny: "<bad>[✘ Отклонить]</bad>"
  button-deny-hover: "<text>Нажмите, чтобы отклонить запрос"
  none: "<prefix:error><text>У вас нет активных запросов на телепортацию."
  none-outgoing: "<prefix:error><text>У вас нет отправленных запросов."
  offline: "<prefix:error><text>Игрок, отправивший запрос, уже вышел."
  accepted: "<prefix:ok><text>Вы приняли запрос игрока <accent><player></accent>."
  accepted-by: "<prefix:ok><accent><player></accent> <text>принял ваш запрос."
  denied: "<prefix:ok><text>Вы отклонили запрос игрока <accent><player></accent>."
  denied-by: "<prefix:warn><accent><player></accent> <text>отклонил ваш запрос."
  cancelled: "<prefix:ok><text>Отменено запросов: <accent><amount></accent>."
  cancelled-by: "<prefix:info><accent><player></accent> <text>отменил запрос на телепортацию."

# ─── Варпы ─────────────────────────────────────────────────────────────────────
warps:
  teleported: "<prefix:ok><text>Вы на варпе <accent><warp></accent>."
  not-found: "<prefix:error><text>Варп <accent><warp></accent> не найден."
  no-access: "<prefix:error><text>У вас нет доступа к варпу <accent><warp></accent>."
  closed: "<prefix:error><text>Владелец закрыл варп <accent><warp></accent>."
  invalid-name: "<prefix:error><text>Название «<accent><warp></accent>» не подходит: от 2 до 16 букв, цифр, <accent>_</accent> или <accent>-</accent>."
  world-disabled: "<prefix:error><text>В этом мире нельзя ставить варпы."
  name-taken: "<prefix:error><text>Название <accent><warp></accent> уже занято."
  limit: "<prefix:error><text>Достигнут лимит варпов: <accent><limit></accent>. Удалите старый (<accent>/delwarp</accent>) или получите привилегию выше."
  created:
    - "<prefix:ok><text>Варп <accent><warp></accent> создан <muted>(<count>/<limit>)</muted>."
    - "<icon:dot> <text>Иконка: <accent>/warpicon <warp></accent> <muted>(предмет в руке или выбор из меню)"
    - "<icon:dot> <text>Описание: <accent>/warpdesc <warp> текст</accent>"
  moved: "<prefix:ok><text>Варп <accent><warp></accent> перенесён сюда."
  deleted: "<prefix:ok><text>Варп <accent><warp></accent> удалён."
  delete-confirm: "<prefix:warn><text>Ещё раз Shift + <icon:rmb> <text>в течение 5 секунд — и варп <accent><warp></accent> будет удалён."
  now-open: "<prefix:ok><text>Варп <accent><warp></accent> открыт для всех."
  now-closed: "<prefix:info><text>Варп <accent><warp></accent> закрыт: телепортироваться можете только вы."
  liked: "<prefix:ok><text>Вам нравится варп <accent><warp></accent>."
  unliked: "<prefix:info><text>Лайк с варпа <accent><warp></accent> убран."
  icon-set: "<prefix:ok><text>Иконка варпа <accent><warp></accent> обновлена."
  description-set: "<prefix:ok><text>Описание варпа <accent><warp></accent> обновлено."
  description-cleared: "<prefix:ok><text>Описание варпа <accent><warp></accent> удалено."
  description-too-long: "<prefix:error><text>Строка описания длиннее <accent><max></accent> символов."
  description-too-many-lines: "<prefix:error><text>Не больше <accent><max></accent> строк описания (строки разделяются знаком <accent>|</accent>)."
  # /warpinfo; строка <description> заменяется описанием варпа.
  info-server:
    - "<icon:bar> <accent><warp></accent> <muted>— серверный варп"
    - "<description>"
    - "<icon:dot> <text>Место: <highlight><world></highlight> <muted><x>, <y>, <z>"
  info-player:
    - "<icon:bar> <accent><warp></accent> <muted>— варп игрока <highlight><owner>"
    - "<description>"
    - "<icon:dot> <text>Место: <highlight><world></highlight> <muted><x>, <y>, <z>"
    - "<icon:dot> <text>Посещений: <highlight><visits></highlight>, лайков: <highlight><likes></highlight>, создан <highlight><date>"
    - "<icon:dot> <text>Статус: <state>"
  # /serverwarp
  server:
    created: "<prefix:ok><text>Серверный варп <accent><warp></accent> создан. Иконка, название и описание: <accent>/serverwarp icon|title|desc</accent>"
    moved: "<prefix:ok><text>Серверный варп <accent><warp></accent> перенесён сюда."
    not-server: "<prefix:error><text>Варп <accent><warp></accent> принадлежит игроку <accent><owner></accent>, это не серверный варп."
    renamed: "<prefix:ok><text>Варп <accent><old></accent> теперь называется <accent><warp></accent>."
    title-set: "<prefix:ok><text>Варп <accent><name></accent> в меню: <warp>"
    order-set: "<prefix:ok><text>Позиция варпа <accent><warp></accent>: <highlight><order></highlight> <muted>(меньше — раньше)"
    perm-set: "<prefix:ok><text>Варп <accent><warp></accent> доступен только с правом <highlight><permission></highlight>."
    perm-cleared: "<prefix:ok><text>Варп <accent><warp></accent> доступен всем."
    unknown-item: "<prefix:error><text>Предмет <accent><item></accent> не найден: опечатка или не установлен плагин предметов."
    list-header: "<icon:bar> <accent>Серверные варпы</accent> <muted>(<count>)"
    list-entry: " <icon:dot> <accent><name></accent> <text><warp></text> <muted>#<order> · <world> <x>, <y>, <z> · <permission>"
    list-empty: "<prefix:info><text>Серверных варпов пока нет: <accent>/serverwarp set <название></accent>"

# ─── Меню ──────────────────────────────────────────────────────────────────────
# <pack>…</pack> видят игроки с ресурспаком, <plain>…</plain> — без него.
menus:
  warps:
    # С ресурспаком заголовок — картинка фона (\uEB40 сдвигает её к краю окна); цвет обязательно белый.
    title-server: "<pack><white>\uEB40\uEB98</white></pack><plain>Серверные варпы</plain>"
    title-players: "<pack><white>\uEB40\uEB99</white></pack><plain>Варпы игроков</plain>"
    title-mine: "<pack><white>\uEB40\uEB99</white></pack><plain>Мои варпы</plain>"
    title-icons: "<pack><white>\uEB40\uEB99</white></pack><plain>Иконка варпа</plain>"
    tab-server:
      name: "<accent>Серверные варпы"
      lore:
        - "<text>Точки, которые поставила администрация"
        - ""
        - "<icon:lmb> <text>Открыть"
    tab-players:
      name: "<accent>Варпы игроков"
      lore:
        - "<text>Точки, которые создали игроки"
        - ""
        - "<icon:lmb> <text>Открыть"
    info-server:
      name: "<accent>Серверные варпы"
      lore:
        - "<text>Точки, которые поставила администрация."
        - ""
        - "<icon:lmb> <text>по варпу — телепортироваться"
        - "<text>Команда: <highlight>/warp название"
    info-players:
      name: "<accent>Варпы игроков"
      lore:
        - "<text>Точки, которые создали игроки."
        - ""
        - "<icon:lmb> <text>— телепортироваться"
        - "<icon:rmb> <text>— поставить или убрать лайк"
        - ""
        - "<text>Свой варп: <highlight>/setwarp название"
        - "<icon:rmb> <text>— сменить иконку"
        - "<text>Shift + <icon:lmb> <text>— открыть или закрыть"
        - "<text>Shift + <icon:rmb> <text>— удалить"
    info-icons:
      name: "<accent>Иконка варпа"
      lore:
        - "<text>Выберите иконку из списка"
        - "<text>или возьмите предмет в руку и нажмите"
        - "<text>на кнопку «Предмет из руки»."
    server-warp:
      name: "<accent><warp>"
      lore:
        - "<description>"
        - ""
        - "<icon:dot> <text>Место: <highlight><world></highlight> <muted><x>, <y>, <z>"
        - ""
        - "<icon:lmb> <text>Телепортироваться"
      # Добавляется к описанию для администрации (/serverwarp).
      staff-lore:
        - "<icon:rmb> <text>Сменить иконку"
        - "<text>Shift + <icon:rmb> <text>Удалить"
    player-warp:
      name: "<accent><warp>"
      lore:
        - "<text>Владелец: <highlight><owner>"
        - "<description>"
        - ""
        - "<icon:dot> <text>Посещений: <highlight><visits></highlight>  Лайков: <highlight><likes>"
        - "<icon:dot> <text>Создан: <highlight><date>"
        - "<icon:dot> <state>"
        - ""
        - "<icon:lmb> <text>Телепортироваться"
        - "<icon:rmb> <text><like-action>"
    own-warp:
      name: "<accent><warp> <muted>(ваш)"
      lore:
        - "<description>"
        - ""
        - "<icon:dot> <text>Посещений: <highlight><visits></highlight>  Лайков: <highlight><likes>"
        - "<icon:dot> <text>Создан: <highlight><date>"
        - "<icon:dot> <state>"
        - ""
        - "<icon:lmb> <text>Телепортироваться"
        - "<icon:rmb> <text>Сменить иконку"
        - "<text>Shift + <icon:lmb> <text>Открыть / закрыть"
        - "<text>Shift + <icon:rmb> <text>Удалить"
    state-open: "<good>Открыт для всех"
    state-closed: "<bad>Закрыт владельцем"
    like: "Поставить лайк"
    unlike: "Убрать лайк"
    empty:
      name: "<muted>Здесь пока пусто"
      lore:
        - "<text>Варпов ещё нет."
    empty-mine:
      name: "<muted>У вас нет варпов"
      lore:
        - "<text>Встаньте на нужное место"
        - "<text>и введите <highlight>/setwarp название"
    back:
      name: "<accent>Назад"
      lore:
        - "<text>В главное меню"
    back-mine:
      name: "<accent>Назад"
      lore:
        - "<text>К моим варпам"
    back-server:
      name: "<accent>Назад"
      lore:
        - "<text>К серверным варпам"
    close:
      name: "<bad>Закрыть"
      lore: []
    previous:
      name: "<accent>Предыдущая страница"
      lore: []
    next:
      name: "<accent>Следующая страница"
      lore: []
    page:
      name: "<text>Страница <accent><page></accent> из <accent><pages>"
      lore: []
    my-warps:
      name: "<accent>Мои варпы"
      lore:
        - "<text>Создано: <highlight><count></highlight> из <highlight><limit>"
        - ""
        - "<icon:lmb> <text>Показать только мои"
    all-warps:
      name: "<accent>Все варпы игроков"
      lore:
        - "<text>Создано вами: <highlight><count></highlight> из <highlight><limit>"
        - ""
        - "<icon:lmb> <text>Показать все"
    create:
      name: "<good>Создать варп"
      lore:
        - "<text>Встаньте на место будущего варпа"
        - "<text>и введите <highlight>/setwarp название"
        - ""
        - "<text>Создано: <highlight><count></highlight> из <highlight><limit>"
        - ""
        - "<icon:lmb> <text>Подставить команду в чат"
    create-hint: "<prefix:info><text>Введите название варпа: <accent>/setwarp название</accent> <muted>(нажмите, чтобы подставить)"
    icon:
      name: "<accent>Выбрать эту иконку"
      lore:
        - "<icon:lmb> <text>Установить"
    icon-selected:
      name: "<good>Текущая иконка"
    icon-hand:
      name: "<accent>Предмет из руки"
      lore:
        - "<text>Сделать иконкой предмет,"
        - "<text>который вы держите в руке"
        - ""
        - "<icon:lmb> <text>Установить"
    icon-hand-empty:
      name: "<muted>Возьмите предмет в руку"
      lore:
        - "<text>Любой предмет из руки, в том числе"
        - "<text>из ItemsAdder, Nexo или Oraxen,"
        - "<text>может стать иконкой варпа."

# ─── Донатные привилегии (/ranks) ──────────────────────────────────────────────
# <rank> — значок привилегии (с ресурспаком) или её цветное название.
ranks:
  list-header: "<icon:bar> <accent><menu-font>Привилегии</menu-font></accent> <muted>· applecube.fun"
  list-entry: " <icon:dot> <rank> <muted>— <text><price> ₽</text> · дома <highlight><homes></highlight> · варпы <highlight><warps></highlight> · KillerMoney <highlight>x<multiplier></highlight>"
  list-entry-held: " <good>✔</good> <rank> <muted>— <text><price> ₽</text> · дома <highlight><homes></highlight> · варпы <highlight><warps></highlight> · KillerMoney <highlight>x<multiplier></highlight> <good>(у вас)</good>"
  list-footer: "<prefix:info><text>Купить: <click:open_url:'https://applecube.fun'><hover:show_text:'<text>Открыть сайт'><accent><u>applecube.fun</u></accent></hover></click>"
  info:
    - "<icon:bar> <accent><player></accent>"
    - " <icon:dot> <text>Привилегия: <rank>"
    - " <icon:dot> <text>Точек дома: <highlight><homes></highlight>, варпов: <highlight><warps>"
    - " <icon:dot> <text>Множитель KillerMoney: <highlight>x<multiplier>"
  none: "<muted>нет"
  unknown: "<prefix:error><text>Привилегия <accent><rank></accent> не найдена. Список: <accent>/ranks"
  bad-time: "<prefix:error><text>Срок <accent><time></accent> не подходит. Пример: <accent>30d</accent>, <accent>12h</accent>, <accent>1mo</accent>."
  given: "<prefix:ok><text>Игроку <accent><player></accent> выдана привилегия <rank><text>."
  taken: "<prefix:ok><text>У игрока <accent><player></accent> снята привилегия <rank><text>."
  announce: "<prefix:ok><accent><player></accent> <text>приобрёл привилегию <rank><text>! Спасибо за поддержку сервера"
  title: "<rank>"
  subtitle: "<text>Привилегия активирована"

# ─── KillerMoney ───────────────────────────────────────────────────────────────
killermoney:
  # Награда за моба (actionbar или чат — notify в killermoney.yml). <multiplier> — строка ниже, если множитель больше 1.
  mob: "<good>+<amount></good> <muted>за</muted> <text><mob></text><multiplier>"
  multiplier: " <highlight>x<value></highlight>"
  pvp-killer: "<prefix:ok><text>Вы забрали <good><amount></good> у игрока <accent><player></accent>."
  pvp-victim: "<prefix:warn><accent><player></accent> <text>забрал у вас <bad><amount></bad>."
  pvp-cooldown: "<prefix:info><text>За повторное убийство <accent><player></accent> деньги будут через <accent><time></accent>."
  info:
    - "<icon:bar> <accent>KillerMoney</accent> <muted>· <player>"
    - " <icon:dot> <text>Ваш множитель: <highlight>x<multiplier></highlight> <muted>(выше с привилегией: /ranks)"
    - " <icon:dot> <text>За убийство игрока: <highlight><percent>%</highlight> <text>его баланса"
    - " <icon:dot> <text>Награды за мобов:"
  info-mob: "   <muted>·</muted> <text><mob></text> <muted>—</muted> <highlight><amount>"

commands:
  applecore:
    description: "Управление плагином AppleCore"
    usage: "<prefix:info><text>Использование: <accent>/applecore <reload|info></accent>"
    reloaded: "<prefix:ok><text>AppleCore перезагружен за <accent><ms> мс</accent>. Новые команды и модули включатся после рестарта."
    info:
      - "<accent><menu-font>AppleCore</menu-font></accent> <muted>v<version>"
      - " <icon:dot> <text>Ресурспак: <resourcepack>"
      - " <icon:dot> <text>Права EssentialsX: <essentials>"
      - " <icon:dot> <text>Модули: <highlight><modules>"
